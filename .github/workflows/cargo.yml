# $schema: https://json.schemastore.org/github-workflow
name: Cargo
run-name: "Cargo: build and publish (${{ github.sha }} @ ${{ github.ref_name }})"
on:
  push:
    branches: [ "master" ]
    tags:     [ "v[0-9]+.[0-9]+.[0-9]+" ]
  pull_request:
    branches: [ "master" ]
env:
  CARGO_TERM_COLOR: always
permissions: {}
jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            os:     Linux
            arch:   Intel/AMD

          - runner: ubuntu-26.04-arm
            os:     Linux
            arch:   ARM

          - runner: windows-latest
            os:     Windows
            arch:   Intel/AMD

          - runner: windows-11-arm
            os:     Windows
            arch:   ARM

          - runner: macos-26-intel
            os:     macOS
            arch:   Intel/AMD

          - runner: macos-26
            os:     macOS
            arch:   ARM

    name:    Build on ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout ${{ github.ref_name }}
        uses: actions/checkout@v7
      - name: Setup cache
        id:   cargo-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Fetch dependencies
        if:   steps.cargo-cache.outputs.cache-hit != 'true'
        run:  cargo fetch --locked
      - name: Build
        run:  cargo build --frozen --verbose
      - name: Run tests
        run:  cargo test  --frozen --verbose
  package:
    name:    Package crate
    needs:   build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ github.ref_name }}
        uses: actions/checkout@v7
      - name: Setup cache
        id:   cargo-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-latest-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Fetch dependencies
        if:   steps.cargo-cache.outputs.cache-hit != 'true'
        run:  cargo fetch --locked
      - name: Package crate
        run:  cargo package --frozen
      - name: Upload crate as artifact
        uses: actions/upload-artifact@v7
        with:
          path:    target/package/*.crate
          archive: false
  publish:
    name:        Publish crate to registry
    if:          ${{ github.ref_type == 'tag' }}
    environment: publish
    needs:       build
    permissions:
      id-token:  write
    runs-on:     ubuntu-latest
    steps:
      - name: Checkout ${{ github.ref_name }}
        uses: actions/checkout@v7
      - name: Setup cache
        id:   cargo-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-latest-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Fetch dependencies
        if:   steps.cargo-cache.outputs.cache-hit != 'true'
        run:  cargo fetch --locked
      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id:   cargo-auth
      - name: Publish crate to crates.io
        run:  cargo publish --frozen
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.cargo-auth.outputs.token }}
