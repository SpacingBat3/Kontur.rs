# $schema: https://json.schemastore.org/github-workflow
name: Cargo
run-name: "${{ github.ref_name }}: build and publish"
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
env:
  CARGO_TERM_COLOR: always
permissions: {}
jobs:
  build:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-26.04-arm
          - windows-latest
          - windows-11-arm
          - macos-26
          - macos-26-intel
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout ${{ github.ref_name }}
        uses: actions/checkout@v7
      - name: Setup cache
        id:   cargo-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Fetch dependencies
        if:   steps.cargo-cache.outputs.cache-hit != 'true'
        run:  cargo fetch --locked
      - name: Build
        run:  cargo build --frozen --verbose
      - name: Run tests
        run:  cargo test  --frozen --verbose
  publish:
    needs:   build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ github.ref_name }}
        uses: actions/checkout@v7
      - name: Setup cache
        id:   cargo-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-latest-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Fetch dependencies
        if:   steps.cargo-cache.outputs.cache-hit != 'true'
        run:  cargo fetch --locked
      - name: Package crate
        run:  cargo package --frozen
      - name: Publish crate as artifact
        uses: actions/upload-artifact@v7
        with:
          path:    target/package/*.crate
          archive: false
